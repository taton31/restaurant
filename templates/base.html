<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #ffffff; --surface-soft: #edf2f4; --text: #172026;
      --muted: #66737d; --accent: #0f766e; --accent-dark: #0b514c; --line: #d9e1e5;
      --warm: #f5c451; --shadow: 0 10px 28px rgba(21, 34, 43, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #e7f3ef 0, transparent 34rem), var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1160px, 100%); margin: 0 auto; padding: 18px; }
    .topbar { display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; align-items: center; gap: 12px; margin-bottom: 16px; }
    .topbar-single { grid-template-columns: 1fr; }
    .topbar-title { grid-column: 2; text-align: center; min-width: 0; }
    .topbar-single .topbar-title { grid-column: 1; }
    .topbar-actions { justify-self: end; }
    .brand { font-size: 32px; font-weight: 850; line-height: 1.05; letter-spacing: 0; }
    .sub { color: var(--muted); margin-top: 6px; font-size: 15px; line-height: 1.35; }
    .panel, .card { background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel { padding: 12px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
    .restaurant, .dish { position: relative; display: flex; flex-direction: column; overflow: visible; min-width: 0; }
    .restaurant { aspect-ratio: 4 / 3; color: white; transition: transform .16s ease, box-shadow .16s ease; }
    .restaurant:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(21, 34, 43, .16); }
    .card-link { position: absolute; inset: 0; z-index: 1; }
    .media-frame { position: relative; overflow: visible; border-radius: 8px; background: var(--surface-soft); }
    .restaurant .media-frame { height: 100%; }
    .restaurant .cover { height: 100%; aspect-ratio: auto; }
    .image-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; background: linear-gradient(180deg, rgba(7, 13, 18, .20), rgba(7, 13, 18, .18) 36%, rgba(7, 13, 18, .76)); }
    .restaurant-overlay { color: white; }
    .restaurant-top, .overlay-top { display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; }
    .restaurant-bottom { display: grid; gap: 10px; }
    .overlay-bottom { display: grid; gap: 9px; }
    .restaurant .name { color: white; text-shadow: 0 1px 18px rgba(0,0,0,.55); }
    .score-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .score-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; border-radius: 999px; padding: 6px 9px; background: rgba(255,255,255,.90); color: #172026; font-size: 13px; font-weight: 760; backdrop-filter: blur(10px); }
    .score-chip.source { background: rgba(17, 24, 39, .68); color: white; border: 1px solid rgba(255,255,255,.18); }
    .rate-popover { position: relative; z-index: 4; pointer-events: auto; }
    .rate-popover[open] { z-index: 80; }
    .rate-popover summary { list-style: none; }
    .rate-popover summary::-webkit-details-marker { display: none; }
    .rate-button { width: 42px; height: 42px; min-height: 42px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.72); background: rgba(255,255,255,.92); color: #0b514c; font-size: 21px; line-height: 1; box-shadow: 0 8px 24px rgba(0,0,0,.20); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .rate-button:hover { background: #fff; color: var(--accent-dark); }
    .score-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 90; pointer-events: auto; width: 220px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.98); box-shadow: 0 18px 44px rgba(21, 34, 43, .22); }
    .score-option { width: 100%; min-height: 36px; padding: 0; border-radius: 7px; background: #f8faf9; color: var(--text); border-color: #d8e2df; }
    .score-option:hover, .score-option.active { background: var(--accent); color: white; border-color: var(--accent); }
    .cover, .dish-image { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface-soft); display: block; }
    .media-frame .cover, .media-frame .dish-image, .media-frame .image-overlay { border-radius: inherit; }
    .dish-image { aspect-ratio: 1 / 1; object-fit: cover; }
    .dish .media-frame { border-radius: 8px 8px 0 0; }
    .dish .image-overlay { padding: 10px; }
    .content { padding: 14px; display: flex; flex-direction: column; gap: 11px; min-width: 0; }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
    .name { font-size: 19px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .dish-title-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
    .dish-title-line .name { min-width: 0; }
    .price { flex: none; color: var(--text); font-size: 14px; font-weight: 760; white-space: nowrap; }
    .meta, .muted { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .stats { display: flex; flex-wrap: wrap; gap: 7px; }
    .stat { border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; background: #fbfcfb; color: #344047; font-size: 13px; }
    .stat strong { display: block; color: var(--text); font-size: 17px; line-height: 1.15; margin-top: 2px; }
    .actions, form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    input, select, textarea, button, .btn, .btn2 { font: inherit; border-radius: 7px; border: 1px solid var(--line); }
    input, select, textarea { background: #fff; color: var(--text); padding: 12px 12px; width: 100%; min-width: 0; }
    textarea { resize: vertical; min-height: 76px; line-height: 1.35; }
    .btn, .btn2, button { min-height: 44px; padding: 10px 13px; cursor: pointer; font-weight: 760; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn, button { background: var(--accent); color: white; border-color: var(--accent); }
    .btn:hover, button:hover { background: var(--accent-dark); }
    .btn2 { background: #fff; color: var(--text); }
    .searchbar { display: grid; gap: 8px; grid-template-columns: minmax(180px, 1fr) 190px 160px auto; }
    .hero { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); margin-bottom: 14px; }
    .restaurant-hero-image { overflow: visible; }
    .restaurant-hero-image .media-frame { aspect-ratio: 16 / 10; }
    .restaurant-hero-image .cover { height: 100%; aspect-ratio: auto; }
    .dish-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .comment { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
    .empty { color: var(--muted); padding: 18px; text-align: center; }
    .footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) {
      body { background: var(--bg); }
      .wrap { padding: 10px; }
      .topbar { grid-template-columns: 1fr; justify-items: center; align-items: stretch; }
      .topbar-title, .topbar-actions { grid-column: auto; justify-self: center; width: 100%; text-align: center; }
      .brand { font-size: 25px; }
      .sub { font-size: 14px; }
      .searchbar, .hero { grid-template-columns: 1fr; }
      .grid, .dish-list { grid-template-columns: 1fr; gap: 12px; }
      .restaurant { aspect-ratio: 16 / 10; }
      .cover { aspect-ratio: 16 / 10; }
      .content { padding: 12px; }
      form.inline, .actions { display: grid; grid-template-columns: 1fr; }
      .btn, .btn2, button { width: 100%; }
      .rate-button { width: 42px; }
      .score-menu { right: 0; width: min(220px, calc(100vw - 42px)); }
      .row { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <script>
    document.addEventListener("click", (event) => {
      document.querySelectorAll(".rate-popover[open]").forEach((popover) => {
        if (!popover.contains(event.target)) {
          popover.removeAttribute("open");
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }
      document.querySelectorAll(".rate-popover[open]").forEach((popover) => {
        popover.removeAttribute("open");
      });
    });
  </script>
</body>
</html>
